<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEVENTEEN · Streaming Milestones</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101526}
iframe{display:block;width:100%;height:100dvh;border:0}
</style></head><body>
<iframe id="archive" title="Streaming milestones archive"></iframe>
<script>
const pages={group:'milestones.html',solo:'milestones.html?type=solo',all:'all-milestones.html'};
const frame=document.getElementById('archive');
let active='group';
function setMode(mode){
 if(!pages[mode])mode='group';
 active=mode;frame.src=pages[mode];
 history.replaceState(null,'','?view='+mode);
}
function addNavigation(){
 const doc=frame.contentDocument;
 if(!doc)return;
 const main=doc.querySelector('main');
 const back=main?.querySelector('a.back');
 if(!main||!back)return;
 const oldTabs=main.querySelector('.source-tabs');
 if(oldTabs)oldTabs.remove();
 const style=doc.createElement('style');
 style.textContent=`
 .milestone-toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
 .milestone-view-tabs{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
 .milestone-view-tabs button{cursor:pointer;border:1px solid #777398;border-radius:999px;padding:11px 18px;color:#fff;background:#292c50;font:800 12px 'Plus Jakarta Sans',Manrope,sans-serif}
 .milestone-view-tabs button[aria-selected=true]{background:linear-gradient(115deg,#ffb8d7,#b9d8ff);color:#182039;border-color:transparent}
 @media(max-width:620px){.milestone-toprow{align-items:stretch}.milestone-view-tabs{width:100%;gap:6px}.milestone-view-tabs button{flex:1;padding:11px 6px;font-size:11px}}
 `;
 doc.head.appendChild(style);
 const top=doc.createElement('div');top.className='milestone-toprow';
 back.parentNode.insertBefore(top,back);top.appendChild(back);
 back.href='index.html';
 back.textContent='← Back to Spotify Stats';
 const nav=doc.createElement('nav');nav.className='milestone-view-tabs';nav.setAttribute('aria-label','Milestone archive');
 for(const [mode,label] of [['group','OT13'],['solo','Units & Solo'],['all','All ✦']]){
  const button=doc.createElement('button');button.type='button';button.textContent=label;
  button.setAttribute('aria-selected',String(active===mode));
  button.addEventListener('click',()=>setMode(mode));nav.appendChild(button);
 }
 top.appendChild(nav);
}
frame.addEventListener('load',addNavigation);
setMode(new URLSearchParams(location.search).get('view')||'group');
</script></body></html>
