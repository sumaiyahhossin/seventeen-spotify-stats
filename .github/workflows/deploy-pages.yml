name: Deploy SEVENTEEN Spotify Stats to GitHub Pages
# Start fresh workflow runs; rerunning a completed run can duplicate the github-pages artifact.

on:
  push:
    branches: [main]
    # Ship site changes, and allow this deployment workflow to deploy its own fix.
    paths:
      - 'data/**'
      - 'assets/**'
      - '*.html'
      - '*.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  # Actions bot commits do not start push-triggered workflows. Deploy after
  # collectors finish, and skip the deployment when they made no new commit.
  workflow_run:
    workflows:
      - Spotify stream snapshots
      - Spotify followers — all 18 solo and unit profiles
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    # A matrix job can fail after the other dataset published verified data.
    # Deploy any new commit even if the companion collection failed.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check whether collector data changed
        id: changed
        if: github.event_name == 'workflow_run'
        env:
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$WORKFLOW_HEAD_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No repository commit was made by this collector run; skipping deployment."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate both JSON datasets before deployment
        if: github.event_name != 'workflow_run' || steps.changed.outputs.deploy == 'true'
        run: python tools/validate_song_data.py

      - name: Verify dashboard JavaScript syntax
        if: github.event_name != 'workflow_run' || steps.changed.outputs.deploy == 'true'
        run: |
          node --check app.js
          node --check all-view.js
          node --check history-popup.js

      - name: Set up GitHub Pages
        if: github.event_name != 'workflow_run' || steps.changed.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: github.event_name != 'workflow_run' || steps.changed.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        if: github.event_name != 'workflow_run' || steps.changed.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4

      - name: Verify GitHub Pages actually serves the new Spotify stats
        if: github.event_name != 'workflow_run' || steps.changed.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tools/verify_published_site.py
