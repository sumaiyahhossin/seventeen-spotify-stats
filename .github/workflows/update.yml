name: Spotify stream snapshots
# 6 PM New York is the first collection window for yesterday's Spotify counts.
# Each recording has three page attempts; missing counts save as labeled zero for that day.
# Check hourly: overdue reports retry across midnight; verified dates stop scanning.
on:
  schedule:
    - cron: '0 * * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  # Keep the new 6 PM schedule independent from legacy collection runs.
  group: spotify-stats-6pm
  cancel-in-progress: false

jobs:
  preflight:
    name: 1. Confirm due dates and test reporting rules
    runs-on: ubuntu-24.04
    outputs:
      group: ${{ steps.gate.outputs.group }}
      solo: ${{ steps.gate.outputs.solo }}
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: Check independent 6 PM New York reporting windows
        id: gate
        run: python tools/gate.py >> "$GITHUB_OUTPUT"
      - name: Test cutoff, DST, and cross-midnight retries
        if: steps.gate.outputs.run == 'true'
        run: python tools/test_reporting_window.py
      - name: Check collector Python syntax
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile tools/pipeline.py tools/gate.py tools/reporting_window.py tools/instrument.py tools/catalog.py tools/validate_song_data.py tools/publish_snapshots.py
      - name: Validate saved source snapshots
        if: steps.gate.outputs.run == 'true'
        run: python tools/validate_song_data.py

  collect:
    name: 2. Collect and validate ${{ matrix.kind }}
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        kind: [group, solo]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Check whether this dataset needs an update
        id: due
        env:
          DATASET_DUE: ${{ needs.preflight.outputs[matrix.kind] }}
        run: echo "due=$DATASET_DUE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.due.outputs.due == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        if: steps.due.outputs.due == 'true'
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v2
        if: steps.due.outputs.due == 'true'
      - name: Install Selenium dependencies
        if: steps.due.outputs.due == 'true'
        run: mvn -q dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Generate track catalog
        if: steps.due.outputs.due == 'true'
        run: python tools/catalog.py
      - name: Collect Spotify counters (3 attempts; unavailable tracks saved as 0)
        id: collection
        if: steps.due.outputs.due == 'true'
        # Spotify page/network outages should retry on the next hourly run,
        # not cause an hourly failure-email storm.
        continue-on-error: true
        env:
          DATASET: ${{ matrix.kind }}
          FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          export COLLECTOR_CLASSPATH="$(cat classpath.txt)"
          python tools/pipeline.py "$DATASET"
      - name: Test collected JSON before publishing
        if: steps.due.outputs.due == 'true' && steps.collection.outcome == 'success'
        run: python tools/validate_song_data.py
      - name: Publish verified JSON with conflict-safe retries
        if: steps.due.outputs.due == 'true' && steps.collection.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          python tools/publish_snapshots.py
      - name: Explain retry for an unsuccessful Spotify scan
        if: steps.due.outputs.due == 'true' && steps.collection.outcome == 'failure'
        run: |
          echo "::warning::Spotify collection was interrupted; preserving previous site data and retrying automatically on the next hourly schedule."
          echo "Spotify collection did not complete; no incomplete data was published. The next hourly run retries the pending reporting date." >> "$GITHUB_STEP_SUMMARY"
      - name: Record freshness and pending reasons
        if: always()
        env:
          DATASET: ${{ matrix.kind }}
        run: python tools/collection_health.py "$DATASET"

  health:
    name: 3. Summarize what actually reached GitHub
    if: ${{ always() && needs.preflight.outputs.run == 'true' }}
    needs: [preflight, collect]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Read latest published snapshots
        run: |
          python tools/collection_health.py group
          python tools/collection_health.py solo
          echo "A verified GitHub commit is not the same as a live Pages deployment; the Pages workflow checks the actual website." >> "$GITHUB_STEP_SUMMARY"
