name: Spotify stream snapshots
# Automatic daily collection at 8:59 PM America/New_York, with hourly catch-up
on:
  schedule:
    - cron: '59 * * * *' # Hourly at :59 UTC; local-time gate starts at 8:59 PM Eastern and retries hourly
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spotify-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check daily schedule and pending state
        id: gate
        run: python tools/gate.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
        if: steps.gate.outputs.run == 'true'
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: mvn -q dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Remove follower values before November 6, 2026
        run: python tools/clean_followers_history.py
      - name: Collect Group streams
        if: steps.gate.outputs.run == 'true'
        env:
          FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          export COLLECTOR_CLASSPATH="$(cat classpath.txt)"
          python tools/catalog.py
          python tools/pipeline.py group
      - name: Commit updated snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          # The job can run for hours while main gets edited. Rebase produces
          # JSON merge conflicts, so apply only newly collected data to fresh main.
          python tools/publish_snapshots.py
