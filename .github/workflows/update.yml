name: Spotify stream snapshots
# Automatic daily collection at 8:59 PM America/New_York, with hourly catch-up
on:
  schedule:
    - cron: '59 * * * *' # Hourly at :59 UTC; local-time gate starts at 8:59 PM Eastern and retries hourly
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spotify-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: |
          mvn -q dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Check daily schedule and pending state
        id: gate
        run: python tools/gate.py >> "$GITHUB_OUTPUT"
      - name: Collect Group streams
        if: steps.gate.outputs.run == 'true'
        env:
          FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          export COLLECTOR_CLASSPATH="$(cat classpath.txt)"
          python tools/catalog.py
          python tools/pipeline.py group
      - name: Commit updated snapshots
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update SEVENTEEN Group streams"
            # A run can outlast edits to main. Rebase before pushing the snapshot.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push was updated by another run; retrying ($attempt/3)"
            done
            echo "Could not publish stats after three attempts" >&2
            exit 1
          fi
