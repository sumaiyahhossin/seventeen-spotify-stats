name: Spotify stream snapshots
# At 2 PM New York, a new reporting date becomes eligible. If Spotify is late,
# recheck the oldest unsaved reporting date hourly, including after midnight.
# The local-time gate prevents collection of dates that are not yet eligible.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  # Run the collector once when this workflow is explicitly updated.
  push:
    paths:
      - '.github/workflows/update.yml'

permissions:
  contents: write

# Prevent different scheduled runs from overlapping, while the two
# independent collectors in one run can operate at the same time.
concurrency:
  group: spotify-stats
  cancel-in-progress: false

jobs:
  collect:
    name: Collect ${{ matrix.kind }} streams
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        kind: [group, solo]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Check independent 2 PM schedule
        id: gate
        run: python tools/gate.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.gate.outputs[matrix.kind] == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        if: steps.gate.outputs[matrix.kind] == 'true'
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v2
        if: steps.gate.outputs[matrix.kind] == 'true'
      - name: Install dependencies
        if: steps.gate.outputs[matrix.kind] == 'true'
        run: mvn -q dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Generate track catalog and prepare collector
        if: steps.gate.outputs[matrix.kind] == 'true'
        run: python tools/catalog.py
      - name: Collect changed streams only
        if: steps.gate.outputs[matrix.kind] == 'true'
        env:
          DATASET: ${{ matrix.kind }}
          FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          export COLLECTOR_CLASSPATH="$(cat classpath.txt)"
          python tools/pipeline.py "$DATASET"
      - name: Validate saved snapshots
        if: steps.gate.outputs[matrix.kind] == 'true'
        env:
          DATASET: ${{ matrix.kind }}
        run: python tools/validate_song_data.py "$DATASET"
      - name: Publish changed JSON safely
        if: steps.gate.outputs[matrix.kind] == 'true'
        env:
          DATASET: ${{ matrix.kind }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          python tools/publish_snapshots.py

  followers:
    name: Diagnose solo and unit follower counts (manual only)
    # Do not repeatedly scan all profiles while Spotify's About parser is broken.
    # Run exactly one diagnostic artist when this workflow is edited.
    # Routine hourly runs stay paused until the Spotify parser is proven.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Run one-profile Spotify follower diagnostic')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Check exact follower coverage
        id: follower_gate
        run: python tools/solo_followers_due.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.follower_gate.outputs.due == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        if: steps.follower_gate.outputs.due == 'true'
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v2
        if: steps.follower_gate.outputs.due == 'true'
      - name: Install Selenium classpath
        if: steps.follower_gate.outputs.due == 'true'
        run: mvn -q dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Collect verified followers without rerunning unchanged songs
        if: steps.follower_gate.outputs.due == 'true'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          export COLLECTOR_CLASSPATH="$(cat classpath.txt)"
          python tools/collect_solo_followers.py
      - name: Publish verified dated follower observations
        if: steps.follower_gate.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/solo-followers.json ]; then
            git add -- data/solo-followers.json
            python tools/publish_snapshots.py
          else
            echo 'No verified follower totals yet; nothing to publish. The next scheduled run will retry.'
          fi
