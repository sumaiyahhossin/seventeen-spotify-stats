name: Spotify stream snapshots
on:
  schedule:
    - cron: '49 19 7 11 *' # One-time Nov 7, 2026 2:49 PM EST (guarded in gate.py)
    - cron: '0 15 * * *' # 00:00 KST
    - cron: '15 * * * *' # retry pending collection hourly
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spotify-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: |
          mvn -q dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Check daily schedule and pending state
        id: gate
        run: python tools/gate.py >> "$GITHUB_OUTPUT"
      - name: Collect Group streams
        if: steps.gate.outputs.run == 'true'
        run: |
          export COLLECTOR_CLASSPATH="$(cat classpath.txt)"
          python tools/catalog.py
          python tools/pipeline.py group
      - name: Commit updated snapshots
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m "Update SEVENTEEN Group streams" && git push)
