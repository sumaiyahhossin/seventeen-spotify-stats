name: Spotify stream snapshots
# At 2 PM New York, today's reporting observation becomes eligible. If Spotify is late,
# recheck the oldest unsaved reporting date hourly, including after midnight.
# A date is published only when verified Spotify counters advance. Test the NY cutoff each run.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  # Run the collector once when this workflow is explicitly updated.
  push:
    paths:
      - '.github/workflows/update.yml'

permissions:
  contents: write

# Prevent different scheduled runs from overlapping, while the two
# independent collectors in one run can operate at the same time.
concurrency:
  group: spotify-stats
  cancel-in-progress: false

jobs:
  collect:
    name: Collect ${{ matrix.kind }} streams
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        kind: [group, solo]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Protect the 2 PM New York cutoff and midnight rollover
        run: python tools/test_reporting_window.py
      - name: Check independent 2 PM schedule
        id: gate
        run: python tools/gate.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.gate.outputs[matrix.kind] == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        if: steps.gate.outputs[matrix.kind] == 'true'
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v2
        if: steps.gate.outputs[matrix.kind] == 'true'
      - name: Install dependencies
        if: steps.gate.outputs[matrix.kind] == 'true'
        run: mvn -q dependency:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Generate track catalog and prepare collector
        if: steps.gate.outputs[matrix.kind] == 'true'
        run: python tools/catalog.py
      - name: Collect changed streams only
        if: steps.gate.outputs[matrix.kind] == 'true'
        env:
          DATASET: ${{ matrix.kind }}
          FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          export COLLECTOR_CLASSPATH="$(cat classpath.txt)"
          python tools/pipeline.py "$DATASET"
      - name: Validate saved snapshots
        if: steps.gate.outputs[matrix.kind] == 'true'
        env:
          DATASET: ${{ matrix.kind }}
        run: python tools/validate_song_data.py "$DATASET"
      - name: Publish changed JSON safely
        if: steps.gate.outputs[matrix.kind] == 'true'
        env:
          DATASET: ${{ matrix.kind }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          python tools/publish_snapshots.py
      - name: Show whether Spotify data actually advanced
        if: always()
        env:
          DATASET: ${{ matrix.kind }}
        run: python tools/collection_health.py "$DATASET"
