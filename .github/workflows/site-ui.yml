name: Browser UI layout and media verification
# Browser smoke tests are run intentionally for site pull requests or manually.
# Do not launch a full Selenium browser test for every small direct push;
# that previously caused repeated GitHub failure emails during rapid edits.
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'history-popup.js'
      - 'all-view.js'
      - 'all.html'
      - 'all-milestones.html'
      - 'all-milestones.js'
      - 'data/all-milestone-evidence.json'
      - 'data/solo-albums.json'
      - 'style.css'
      - 'milestones.js'
      - 'milestones.html'
      - 'tools/verify_site_ui.py'
      - '.github/workflows/site-ui.yml'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v2
      - name: Install Selenium
        run: pip install --quiet 'selenium>=4.25,<5'
      - name: Verify actual desktop/mobile browser rendering
        run: python tools/verify_site_ui.py
